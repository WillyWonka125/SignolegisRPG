name: SignolegisRPG
main: io.github.willywonka125.SignolegisRPG.Signolegis
version: 0.3
depend: [Citizens]
api-version: '1.21'
commands:
  signo:
    description: Singolegis administrative command
    usage: /signo help
    aliases: [sg, sig, si]
    permission: signolegis.admin
  quests:
    description: Signolegis quests command
    usage: /quests
    aliases: [q, quest]

permissions:
  signolegis.*:
    description: Gives access to all signolegis commands
    children:
      signolegis.bypassfilter: true
      signolegis.admin: true
  signolegis.admin:
    description: Gives access to admin-restricted Signolegis commands.
    default: op
  quests.*:
    description: Gives access to all quests features and commands
    children:
      quests.create: true